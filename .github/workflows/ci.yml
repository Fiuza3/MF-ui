name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      - name: Registrar o dist/ commitado
        run: find dist -type f | sort > "$RUNNER_TEMP/dist-commitado.txt"

      - name: Build
        run: pnpm build

      - name: dist/ está sincronizado com src/
        # A comparação é pela LISTA de arquivos, não pelo conteúdo: o esbuild
        # emite os blocos de import em ordem variável entre execuções, então
        # dois builds do mesmo source não são byte a byte iguais. Os nomes de
        # chunk, por outro lado, carregam hash de conteúdo — se o src mudou e
        # o dist não foi regerado, a lista muda e este passo pega.
        run: |
          find dist -type f | sort > "$RUNNER_TEMP/dist-rebuild.txt"
          if ! diff -u "$RUNNER_TEMP/dist-commitado.txt" "$RUNNER_TEMP/dist-rebuild.txt"; then
            echo "::error::O dist/ commitado não corresponde ao build de src/. Rode 'pnpm build' e commite o dist/ atualizado."
            exit 1
          fi
          echo "dist/ sincronizado."
