name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Testes
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: dist/ está sincronizado com src/
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::O dist/ commitado não corresponde ao build de src/."
            echo "Rode 'pnpm build' e commite o dist/ atualizado."
            git --no-pager diff --stat dist
            exit 1
          fi
          echo "dist/ sincronizado."
